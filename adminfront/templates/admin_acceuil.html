<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil Administrateur</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/3.10.2/mdb.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <style>
        body {
            background-color: #4f6f41;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
            color: #fff;
            background-color: #333;
        }
        .btn-custom {
            margin: 1rem;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="fw-bold">Bienvenue sur la plateforme d'administration</h1>
        <p>Veuillez vous connecter ou vous inscrire pour accéder à votre compte administrateur.</p>
        <a href="{% url 'connexion_admin' %}" class="btn btn-primary btn-custom">Connexion</a>
        <a href="{% url 'inscription_admin' %}" class="btn btn-secondary btn-custom">Inscription</a>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/3.10.2/mdb.min.js"></script>
</body>
</html>
