{% load static %}
<!DOCTYPE html>
<html lang="fr" class="light-style customizer-hide" dir="ltr" data-theme="theme-default">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
  <title>Connexion Administration | E-SHOP</title>

  <link rel="icon" type="image/x-icon" href="{% static 'images/eshop.png' %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'admin/assets/vendor/fonts/boxicons.css' %}" />
  <link rel="stylesheet" href="{% static 'admin/assets/vendor/css/core.css' %}" />
  <link rel="stylesheet" href="{% static 'admin/assets/vendor/css/theme-default.css' %}" />
  <link rel="stylesheet" href="{% static 'admin/assets/vendor/css/pages/page-auth.css' %}" />
</head>

<body style="background-color: #f5f5f9;">
  <div class="container-xxl">
    <div class="authentication-wrapper authentication-basic container-p-y">
      <div class="authentication-inner">
        <!-- Carte Connexion Admin -->
        <div class="card border-0 shadow-lg rounded-4">
          <div class="card-body p-4 p-md-5">
            <!-- Logo -->
            <div class="app-brand justify-content-center mb-4">
              <a href="{% url 'home' %}" class="app-brand-link gap-2 text-decoration-none">
                <span class="app-brand-logo demo">
                  <i class="bx bx-shield-quarter fs-2 text-primary"></i>
                </span>
                <span class="app-brand-text demo text-body fw-bolder text-uppercase fs-4">E-SHOP Admin</span>
              </a>
            </div>

            <h4 class="mb-2 text-dark fw-bold text-center">Espace Administration 🔐</h4>
            <p class="mb-4 text-muted small text-center">Veuillez vous authentifier pour accéder au backoffice de gestion.</p>

            {% if messages %}
              {% for message in messages %}
                <div class="alert alert-{{ message.tags|default:'danger' }} alert-dismissible fade show p-2 small" role="alert">
                  {{ message }}
                  <button type="button" class="btn-close p-2" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
              {% endfor %}
            {% endif %}

            <form id="formAuthentication" class="mb-3" method="POST" action="{% url 'connexion_admin' %}">
              {% csrf_token %}
              <div class="mb-3">
                <label for="username" class="form-label fw-semibold">Nom d'utilisateur</label>
                <input
                  type="text"
                  class="form-control"
                  id="username"
                  name="username"
                  placeholder="Entrez votre identifiant admin"
                  autofocus
                  required
                />
              </div>
              <div class="mb-4 form-password-toggle">
                <label class="form-label fw-semibold" for="password">Mot de passe</label>
                <div class="input-group input-group-merge">
                  <input
                    type="password"
                    id="password"
                    class="form-control"
                    name="password"
                    placeholder="••••••••••••"
                    required
                  />
                  <span class="input-group-text cursor-pointer"><i class="bx bx-hide"></i></span>
                </div>
              </div>
              <div class="mb-3">
                <button class="btn btn-primary d-grid w-100 py-2 fw-semibold" type="submit">
                  Se Connecter à l'Administration
                </button>
              </div>
            </form>

            <div class="text-center pt-3 border-top">
              <a href="{% url 'home' %}" class="d-flex align-items-center justify-content-center text-muted small text-decoration-none">
                <i class="bx bx-chevron-left scaleX-n1-rtl bx-sm"></i>
                Retourner à la boutique publique
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="{% static 'admin/assets/vendor/libs/jquery/jquery.js' %}"></script>
  <script src="{% static 'admin/assets/vendor/js/bootstrap.js' %}"></script>
  <script src="{% static 'admin/assets/js/main.js' %}"></script>
</body>
</html>
