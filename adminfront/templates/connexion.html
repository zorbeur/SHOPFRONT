{% load static %}
<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion Administration | E-SHOP Togo</title>

  <link rel="icon" type="image/png" href="{% static 'images/eshop.png' %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" />

  <style>
    :root {
      --helios-bg: #111015;
      --helios-card: #181622;
      --helios-card-inner: #201d2d;
      --helios-border: rgba(255, 255, 255, 0.08);
      --helios-pink: #d946ef;
      --helios-pink-glow: rgba(217, 70, 239, 0.3);
      --helios-orchid: #c084fc;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--helios-bg);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(217, 70, 239, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(192, 132, 252, 0.08) 0%, transparent 40%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: var(--helios-card);
      border: 1px solid var(--helios-border);
      border-radius: 32px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
      max-width: 440px;
      width: 100%;
      padding: 40px;
    }
    .brand-icon-wrap {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #d946ef 0%, #c084fc 100%);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #ffffff;
      margin: 0 auto 16px auto;
      box-shadow: 0 8px 24px var(--helios-pink-glow);
    }
    .form-control {
      background-color: var(--helios-card-inner) !important;
      border: 1px solid var(--helios-border) !important;
      color: #ffffff !important;
      border-radius: 14px !important;
      padding: 13px 18px !important;
    }
    .form-control:focus {
      border-color: var(--helios-pink) !important;
      box-shadow: 0 0 0 3px var(--helios-pink-glow) !important;
    }
    .btn-submit {
      background: linear-gradient(135deg, #f472b6 0%, #c084fc 50%, #e879f9 100%);
      color: #111015;
      font-weight: 800;
      border: none;
      border-radius: 50px;
      padding: 14px;
      width: 100%;
      transition: all 0.2s;
      box-shadow: 0 6px 20px var(--helios-pink-glow);
    }
    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(217, 70, 239, 0.45);
      color: #000;
    }
  </style>
</head>

<body>
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="brand-icon-wrap">
        <i class="fa-solid fa-shapes"></i>
      </div>
      <h3 class="fw-bold text-white mb-1">E-SHOP <span style="color: var(--helios-pink);">Suite</span></h3>
      <p class="text-muted small mb-0">Portail d'Administration & Backoffice</p>
    </div>

    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-dark border border-secondary-subtle rounded-3 small p-2 mb-3">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'connexion_admin' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label small fw-bold text-muted">Nom d'utilisateur</label>
        <input type="text" name="username" class="form-control" placeholder="Identifiant admin" required autofocus>
      </div>

      <div class="mb-4">
        <label class="form-label small fw-bold text-muted">Mot de passe</label>
        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-submit mb-3">
        Accéder au Dashboard &rarr;
      </button>

      <div class="text-center">
        <a href="{% url 'home' %}" class="text-muted text-decoration-none small">
          <i class="fa-solid fa-arrow-left me-1"></i> Retour à la boutique publique
        </a>
      </div>
    </form>
  </div>

  <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
