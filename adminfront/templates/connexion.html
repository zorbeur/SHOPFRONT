{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion Administration | E-SHOP Togo</title>

  <link rel="icon" type="image/png" href="{% static 'images/eshop.png' %}" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" />

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 10% 20%, #0f172a 0%, #1e293b 90%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      max-width: 440px;
      width: 100%;
      overflow: hidden;
    }
    .auth-header {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      padding: 35px 30px;
      text-align: center;
      color: #ffffff;
    }
    .brand-icon-wrap {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #ffffff;
      margin: 0 auto 12px auto;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
    }
    .form-control {
      border-radius: 12px;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
    }
    .form-control:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
    }
    .btn-submit {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      font-weight: 700;
      border-radius: 12px;
      padding: 14px;
      width: 100%;
      transition: all 0.2s;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
    }
    .btn-submit:hover {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
    }
  </style>
</head>

<body>
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-icon-wrap">
        <i class="fa-solid fa-shield-halved"></i>
      </div>
      <h3 class="fw-bold mb-1">E-SHOP<span class="text-warning">.</span></h3>
      <p class="text-white-50 small mb-0">Portail d'Administration & Backoffice</p>
    </div>

    <div class="p-4 p-md-5">
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'danger' }} rounded-3 small p-2 mb-3">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}

      <form method="POST" action="{% url 'connexion_admin' %}">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label small fw-bold text-dark">Nom d'utilisateur</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-user"></i></span>
            <input type="text" name="username" class="form-control border-start-0" placeholder="Identifiant admin" required autofocus>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label small fw-bold text-dark">Mot de passe</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
            <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
          </div>
        </div>

        <button type="submit" class="btn btn-submit mb-3">
          <i class="fa-solid fa-right-to-bracket me-2"></i> Accéder au Tableau de Bord
        </button>

        <div class="text-center">
          <a href="{% url 'home' %}" class="text-muted text-decoration-none small">
            <i class="fa-solid fa-arrow-left me-1"></i> Retour à la boutique publique
          </a>
        </div>
      </form>
    </div>
  </div>

  <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
