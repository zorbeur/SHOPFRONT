{% extends 'admin_base.html' %}
{% load static %}

{% block title %}Supprimer Notification | E-SHOP Admin{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card border-0 shadow-sm text-center p-4">
      <div class="card-body">
        <span class="d-inline-flex p-3 rounded-circle bg-label-danger fs-1 mb-3">
          <i class="bx bx-trash"></i>
        </span>
        <h4 class="fw-bold text-dark mb-2">Supprimer la notification</h4>
        <p class="text-muted mb-4">
          Êtes-vous certain de vouloir supprimer cette notification ?<br>
          <em class="text-dark d-block mt-2">« {{ notification.message }} »</em>
        </p>

        <form method="POST">
          {% csrf_token %}
          <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'afficher_notifications' %}" class="btn btn-outline-secondary rounded-pill px-4">Annuler</a>
            <button type="submit" class="btn btn-danger rounded-pill px-4">
              <i class="bx bx-trash me-1"></i> Supprimer
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
