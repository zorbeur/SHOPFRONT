{% extends 'base.html' %}
{% load static %}

{% block title %}Page non trouvée (404) | E-SHOP{% endblock %}

{% block content %}
<div class="py-5 text-center" style="background-color: #f8faf9; min-height: 60vh;">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h1 class="display-1 fw-bold text-success">404</h1>
        <h3 class="fw-bold text-dark mb-3">Oups ! Page Introuvable</h3>
        <p class="text-muted mb-4">
          La page que vous recherchez semble avoir été déplacée, supprimée ou n'existe pas.
        </p>
        <a href="{% url 'home' %}" class="btn btn-primary btn-lg rounded-pill px-5">
          <i class="fa-solid fa-house me-2"></i> Retourner à l'accueil
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
