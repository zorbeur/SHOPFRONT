<!DOCTYPE html>
<html>
<head>
    <title>État de la commande</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }
        .container {
            margin-top: 50px;
        }
        .card {
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }
        .card-header {
            background-color: #007bff;
            color: white;
            font-size: 1.25rem;
            padding: 10px 15px;
        }
        .card-body {
            padding: 20px;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #004085;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                État de la commande
            </div>
            <div class="card-body">
                <p><strong>Commande ID :</strong> {{ commande.id }}</p>
                <p><strong>Total :</strong>  {{ commande.total|floatformat:2 }} €</p>
                <p><strong>Adresse de livraison :</strong> {{ commande.adresse_livraison }}</p>
                <p><strong>État de la commande :</strong> {{ commande.get_etat_commande_display }}</p>
                <!-- Vous pouvez ajouter plus de détails si nécessaire -->
                <a href="{% url 'shop' %}" class="btn btn-primary">Retour à la boutique</a>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.4/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
